[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# All AI functions are background (up to 15 min, return 202 immediately)
[functions."generate-niche-background"]
  timeout = 60

[functions."generate-plan-background"]
  timeout = 60

[functions."generate-visual-dna-background"]
  timeout = 180

[functions."generate-copy-background"]
  timeout = 180

[functions."generate-images-background"]
  timeout = 900

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  port = 5173
  targetPort = 5173
  autoLaunch = false
