[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/**"]

[functions."generate-niche"]
  timeout = 30

[functions."generate-plan"]
  timeout = 30

[functions."generate-visual-dna"]
  timeout = 60

[functions."generate-copy"]
  timeout = 60

[functions."generate-images-background"]
  timeout = 900

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  port = 5173
  targetPort = 5173
  autoLaunch = false
