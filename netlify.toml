[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@supabase/supabase-js"]

# Short functions — default 10s is fine
[functions."generate-niche"]
  timeout = 30

[functions."generate-plan"]
  timeout = 30

[functions."generate-visual-dna"]
  timeout = 60

[functions."generate-copy"]
  timeout = 60

# Image generation is a Background Function (up to 15 min)
# Netlify auto-detects background functions by the -background suffix
# Returns 202 immediately — frontend polls Supabase for progress
[functions."generate-images-background"]
  timeout = 900

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  port = 5173
  targetPort = 5173
